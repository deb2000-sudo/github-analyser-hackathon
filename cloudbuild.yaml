# Environment-specific values are Cloud Build substitutions (override per trigger).
# Production GCP (master): defaults below.
# Staging GCP (dev-feature): override in the trigger — see README "Deploy".
#
# Prerequisite: Secret Manager secrets (same id as env var name):
#   FIREBASE_PROJECT_ID, FIREBASE_PRIVATE_KEY, FIREBASE_CLIENT_EMAIL,
#   FIREBASE_DATABASE_URL, FIREBASE_WEB_API_KEY, GITHUB_TOKEN
#
# Deploy:
#   gcloud builds submit --config cloudbuild.yaml --project=nxt-acad-hackathon

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: production
  # Vertex AI + GCS (non-secret). GITHUB_TOKEN + FIREBASE_* from Secret Manager.
  _GCP_LOCATION: us-central1
  _GCS_BUCKET: nxt-acad-hackathon-hackathon-evaluations
  _GEMINI_MODEL: gemini-2.5-flash
  _GCS_CACHE_PREFIX: github-cache
  _GITHUB_CACHE_TTL: '86400'
  _FIRESTORE_COLLECTION: github_analysis_jobs
  # Cloud Run runtime SA — same project as this Cloud Build (must have Secret Manager access).
  # Do not use nxt-acad-ai-hackathon-evaluator@nxt-create-deb (different project → actAs denied).
  _RUN_SERVICE_ACCOUNT: nxt-acad-ai-hackathon-evaluate@nxt-acad-hackathon.iam.gserviceaccount.com

steps:
  # Step 1: Ensure Artifact Registry repository exists (required before first push)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud artifacts repositories describe github-analyser \
          --location=${_REGION} \
          --project=$PROJECT_ID 2>/dev/null \
          || gcloud artifacts repositories create github-analyser \
            --repository-format=docker \
            --location=${_REGION} \
            --description="Docker repository for GitHub Analyser" \
            --project=$PROJECT_ID

  # Step 2: Build Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:latest
      - .

  # Step 3: Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser

  # Step 4: Ensure GCS cache bucket exists (colocated with Cloud Run + Vertex)
  # Note: bash vars must use $$ so Cloud Build does not treat them as substitutions.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BUCKET=gs://${_GCS_BUCKET}
        DESIRED_LOCATION=${_REGION}
        if gcloud storage buckets describe "$$BUCKET" >/dev/null 2>&1; then
          CURRENT_LOCATION=$$(gcloud storage buckets describe "$$BUCKET" --format='value(location)' | tr '[:upper:]' '[:lower:]')
          if [ "$$CURRENT_LOCATION" != "$$DESIRED_LOCATION" ]; then
            echo "WARNING: $$BUCKET is in $$CURRENT_LOCATION (want $$DESIRED_LOCATION)."
            echo "Keeping existing bucket — GCS locations are immutable."
          else
            echo "Bucket $$BUCKET already in $$DESIRED_LOCATION"
          fi
        else
          gcloud storage buckets create "$$BUCKET" \
            --location="$$DESIRED_LOCATION" \
            --uniform-bucket-level-access
          echo "Created $$BUCKET in $$DESIRED_LOCATION"
        fi

  # Step 5: Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE=${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:$BUILD_ID

        gcloud run deploy github-analyser \
          --image="$$IMAGE" \
          --region=${_REGION} \
          --platform=managed \
          --service-account=${_RUN_SERVICE_ACCOUNT} \
          --allow-unauthenticated \
          --port=8080 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --concurrency=10 \
          --min-instances=0 \
          --max-instances=10 \
          --update-secrets=FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_DATABASE_URL=FIREBASE_DATABASE_URL:latest,FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest \
          --set-env-vars=ENVIRONMENT=${_ENVIRONMENT},GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_GCP_LOCATION},EVALUATION_BUCKET_NAME=${_GCS_BUCKET},GEMINI_MODEL=${_GEMINI_MODEL},VERTEX_ENABLED=true,GCS_CACHE_PREFIX=${_GCS_CACHE_PREFIX},GITHUB_CACHE_TTL_SECONDS=${_GITHUB_CACHE_TTL},FIRESTORE_COLLECTION_JOBS=${_FIRESTORE_COLLECTION},HOST=0.0.0.0 \
          --project=$PROJECT_ID

        SERVICE_URL=$$(gcloud run services describe github-analyser \
          --region=${_REGION} --project=$PROJECT_ID --format='value(status.url)')
        echo "Deployed: $$SERVICE_URL (runtime SA: ${_RUN_SERVICE_ACCOUNT})"
    env:
      - CLOUDSDK_COMPUTE_REGION=${_REGION}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/github-analyser/github-analyser:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

# Cloud Build SA: roles/run.admin, roles/artifactregistry.writer,
# roles/iam.serviceAccountUser on ${_RUN_SERVICE_ACCOUNT}
