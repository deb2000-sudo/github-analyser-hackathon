# Deploy github-analyser to Cloud Run via Cloud Build.
#
# Secrets (already in GCP Secret Manager — same id as env var name):
#   FIREBASE_PROJECT_ID, FIREBASE_PRIVATE_KEY, FIREBASE_CLIENT_EMAIL,
#   FIREBASE_DATABASE_URL, FIREBASE_WEB_API_KEY, GITHUB_TOKEN
#
# Vertex AI + GCS settings are plain env vars below (not secrets).
#
# Deploy:
#   gcloud builds submit --config cloudbuild.yaml --project=nxt-acad-hackathon

substitutions:
  _REGION: us-central1
  _SERVICE: github-analyser
  _AR_REPO: cloud-run-source-deploy
  _RUN_SERVICE_ACCOUNT: ""
  # Vertex AI + GCS (non-secret — edit here if needed)
  _GCP_PROJECT: nxt-acad-hackathon
  _GCP_LOCATION: us-central1
  _GCS_BUCKET: nxt-acad-hackathon-hackathon-evaluations
  _GEMINI_MODEL: gemini-2.5-flash
  _GCS_CACHE_PREFIX: github-cache
  _GITHUB_CACHE_TTL: "86400"
  _FIRESTORE_COLLECTION: github_analysis_jobs

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: ensure-artifact-registry
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud artifacts repositories describe "${_AR_REPO}" \
          --location="${_REGION}" \
          --project="$PROJECT_ID" 2>/dev/null || \
        gcloud artifacts repositories create "${_AR_REPO}" \
          --repository-format=docker \
          --location="${_REGION}" \
          --description="Cloud Run images for github-analyser" \
          --project="$PROJECT_ID"

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: ensure-secret-access
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ -n "${_RUN_SERVICE_ACCOUNT}" ]]; then
          RUN_SA="${_RUN_SERVICE_ACCOUNT}"
        else
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          RUN_SA="$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        fi

        for SECRET_ID in \
          GITHUB_TOKEN \
          FIREBASE_PROJECT_ID \
          FIREBASE_PRIVATE_KEY \
          FIREBASE_CLIENT_EMAIL \
          FIREBASE_DATABASE_URL \
          FIREBASE_WEB_API_KEY; do
          if ! gcloud secrets describe "$${SECRET_ID}" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "ERROR: Secret '$${SECRET_ID}' not found in project $PROJECT_ID" >&2
            exit 1
          fi
          gcloud secrets add-iam-policy-binding "$${SECRET_ID}" \
            --member="serviceAccount:$${RUN_SA}" \
            --role=roles/secretmanager.secretAccessor \
            --project="$PROJECT_ID" \
            --quiet
        done
        echo "Secret accessor granted to $${RUN_SA}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID"

        ENV_VARS="GOOGLE_CLOUD_PROJECT=${_GCP_PROJECT}"
        ENV_VARS="$${ENV_VARS},GOOGLE_CLOUD_LOCATION=${_GCP_LOCATION}"
        ENV_VARS="$${ENV_VARS},EVALUATION_BUCKET_NAME=${_GCS_BUCKET}"
        ENV_VARS="$${ENV_VARS},GEMINI_MODEL=${_GEMINI_MODEL}"
        ENV_VARS="$${ENV_VARS},VERTEX_ENABLED=true"
        ENV_VARS="$${ENV_VARS},GCS_CACHE_PREFIX=${_GCS_CACHE_PREFIX}"
        ENV_VARS="$${ENV_VARS},GITHUB_CACHE_TTL_SECONDS=${_GITHUB_CACHE_TTL}"
        ENV_VARS="$${ENV_VARS},FIRESTORE_COLLECTION_JOBS=${_FIRESTORE_COLLECTION}"
        ENV_VARS="$${ENV_VARS},HOST=0.0.0.0"

        SECRETS="GITHUB_TOKEN=GITHUB_TOKEN:latest"
        SECRETS="$${SECRETS},FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest"
        SECRETS="$${SECRETS},FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest"
        SECRETS="$${SECRETS},FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest"
        SECRETS="$${SECRETS},FIREBASE_DATABASE_URL=FIREBASE_DATABASE_URL:latest"
        SECRETS="$${SECRETS},FIREBASE_WEB_API_KEY=FIREBASE_WEB_API_KEY:latest"

        DEPLOY_ARGS=(
          run deploy "${_SERVICE}"
          --image="$${IMAGE}"
          --region="${_REGION}"
          --platform=managed
          --allow-unauthenticated
          --port=8080
          --memory=1Gi
          --cpu=1
          --timeout=300
          --concurrency=10
          --min-instances=0
          --max-instances=10
          --set-env-vars="$${ENV_VARS}"
          --set-secrets="$${SECRETS}"
          --project="$PROJECT_ID"
        )

        if [[ -n "${_RUN_SERVICE_ACCOUNT}" ]]; then
          DEPLOY_ARGS+=(--service-account="${_RUN_SERVICE_ACCOUNT}")
        fi

        gcloud "$${DEPLOY_ARGS[@]}"

        gcloud run services describe "${_SERVICE}" \
          --region="${_REGION}" \
          --project="$PROJECT_ID" \
          --format='value(status.url)'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY

# Cloud Build SA: roles/run.admin, roles/artifactregistry.writer,
# roles/iam.serviceAccountUser, roles/secretmanager.admin
